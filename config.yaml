# 每个 source 的 source_revision 应替换为下载时记录的上游 commit、release 或不可变快照标识。
runtime:
  # 单次交给低维数据读取器处理的帧数量。增大可提高吞吐，但会提高峰值内存。
  batch_size: 64
  # 可并行处理的 worker 数。建议不超过本机 CPU 核数，也要考虑磁盘带宽。
  worker_count: 8
  # 已被读取但尚未完成质检/入库的 episode 上限，用于限制并发时的内存占用。
  max_in_flight_episodes: 8

paths:
  # 原始数据根目录。以下所有相对 root 都以此目录为基准解析。
  input_root: input_data
  # SQLite、处理报告和训练导出文件的统一输出目录；不会修改 input_root。
  output_root: output
  # 数据库文件名，最终路径固定为 output_root / database_filename。
  database_filename: robot_pipeline.sqlite

# 训练子集导出配置。导出按 source_id + robot_type 分桶轮询，避免最大来源吞没预算。
export:
  frame_budget: 50000
  # 每行 JSONL 保存一个连续 clip；预算最后不足一个 clip 时允许截断。
  clip_length: 16
  output_filename: train.jsonl
  # 默认只导出 accepted；true 时同时包含 needs_review。
  include_needs_review: false

sources:
  # source_id + source_revision + native_episode_id 是 episode 的唯一性约束。
  - source_id: lerobot_aloha_transfer_cube_human
    # Hugging Face dataset commit used for this local download.
    source_revision: 6a43d500f101255823a9d2b9dc244eeb01a2cd31
    # 用于血缘追踪的来源定位；不参与数据库唯一性判断。
    source_uri: https://huggingface.co/datasets/lerobot/aloha_sim_transfer_cube_human/tree/6a43d500f101255823a9d2b9dc244eeb01a2cd31
    # profile 提供格式、fps、语义映射和标准 adapter 默认值；大多数新增同类数据只需改本段身份和 root。
    profile: lerobot_aloha_dual_arm
    root: lerobot_aloha_sim_transfer_cube_human

  - source_id: oxe_bridge
    source_revision: 3cde9e791b4f9d3ad93efcdd1e47747f2c37edd1
    source_uri: https://huggingface.co/datasets/jxu124/OpenX-Embodiment/tree/3cde9e791b4f9d3ad93efcdd1e47747f2c37edd1
    # 新增同结构的 OXE Bridge 数据时，仅需复制这五个字段并修改 source_id/revision/uri/root。
    profile: oxe_bridge
    root: oxe_bridge

  - source_id: robomimic_test
    source_revision: 74fa018461f479cd9fd15b924a16103012096203
    source_uri: https://huggingface.co/datasets/robomimic/robomimic_datasets/tree/74fa018461f479cd9fd15b924a16103012096203
    profile: robomimic_panda_low_dim
    # 相对 input_root 的 robomimic 数据目录；HDF5 文件名在 adapter_options 中配置。
    root: robomimic
